<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="محلات ....  لبيع الأدوية بالجملة للصيدليات">

    <title> تصريف الأدوية</title>

      -->
    <!-- datatables -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" defer></script>
    <!-- end database -->

    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">


    <!-- Google tag (gtag.js) -->

    <link href="Style.css" rel="stylesheet" />

    <style>
        

        .alert {
            background-color: #ffdddd;
            /* خلفية زرقاء فاتحة أو رمادي فاتح */
            color: #cc0000;
            /* نص أزرق داكن */
            padding: 7px 14px;
            font-size: 1rem;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            /* زوايا دائرية ناعمة */
            width: auto;
            /* العرض تلقائي */
            position: absolute;
            top: 25px;
            left: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            /* ظل خفيف */
        }

        .header{
            margin-top: 10px;
        }
      
        /* تنسيق معلومات المتجر */
footer {
    background-color: #333; /* خلفية داكنة */
    color: #fff; /* النص الأبيض ليظهر بشكل جيد على الخلفية الداكنة */
    padding: 20px 0; /* تباعد داخلي أعلى وأسفل */
    width: 100%; /* يعرض footer بالكامل */
    text-align: center;
    position: relative;
}

footer p {
    /* font-size: 1.2rem; */
    font-family: "Tajawal", sans-serif !important;
    color: #fff;
    margin: 5px 0;
    font-size: 0.875rem !important;
}

    </style>
</head>

<body>

    <div class="header">
        <h1 class="name">لتصريف الأدوية</h1>
        <h3 class="description">للأدوية و المستلزمات الطبية</h3>
<!--         <div class="alert">لصيدليات فقط</div>  التنبيه هنا --> 

    </div>

    <div class="cart-nav">
        <button id="cartButton">
            <div class="cart-icon">
                🛒
                <span id="cart-count">0</span>
            </div>
        </button>
    </div>

    <div class="container">


        <!-- <div class="box" id="orderListTitle" style="display:none;"> -->
            <div class="box order-list-card" id="orderListTitle" style="display:none;">
            <!-- <h2>قائمة طلبك</h2> -->
             <h2 class="table-title">قائمة طلبك</h2>
            <table id="orderTable">
                <thead>
                    <tr>
                        <th>الانتهاء</th>
                        <th>الصنف</th>
                        <th>الكمية</th>
                        <th>السعر</th>
                        <th>الأجمالي</th>
                        <th>إلغاء</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- سيتم إضافة الطلبات هنا -->

                </tbody>
            </table>
            <div class="twoButton">
                <button class="btn btn-green" id="sendOrderBtn" onclick="sendOrderViaWhatsApp()">إرسال الطلب عبر
                    واتساب</button>
                <button class="btn btn-red" id="cancelAllOrdersBtn" onclick="cancelAllOrders()">إلغاء الطلب</button>
            </div>

        </div>


        <!-- <div class="box"> -->
            <div class="box available-items-card">
            <!-- <h2>الاصناف المتوفرة</h2> -->
             <h2 class="table-title">الاصناف المتوفرة</h2>

            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>الانتهاء</th>
                        <th>الصنف</th>
                        <th>الكمية</th>
                        <th>السعر</th>
                        <th>لطلب</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- سيتم إضافة المنتجات هنا -->
                </tbody>
            </table>


        </div>
        <!-- واجهة الطلب المنبثقة -->
        <div id="orderModal" class="orderModal">

            <h3 id="modalProductName"></h3>
            <p id="modalProductDate"></p>
            <label for="quantit">الكمية:</label>
            <div class="quantity-container">

                <!-- زر النقصان -->
                <button class="quantity-btn" onclick="decrement()">-</button>

                <!-- حقل إدخال الكمية -->
                <input type="number" class="quantity-input" id="quantity" value="1" min="1">

                <!-- زر الزيادة -->
                <button class="quantity-btn" onclick="increment()">+</button>
            </div>

            <br><br>
            <div id="quantityError" style="color: #f44336; font-weight: bold; margin-top: 10px; display: none;">
    <!-- سيتم عرض رسالة الخطأ هنا -->
</div>
            <div class="twoButton">
                <button class="btn btn-green" onclick="addToOrder()">اضافة +</button>
                <button class="btn btn-red" onclick="closeModal()">إلغاء ×</button>
            </div>
        </div>
        <div id="overlay" class="overlay" onclick="closeModal()"></div>

        <script type="text/javascript" src="JavaScript.js" defer></script>

        <!-- نافذة الاخطاء -->
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModalError()">&times;</span>
                <h2>خطأ!</h2>
                <p id="errorMessage">هنا ستظهر تفاصيل الخطأ.</p>
            </div>
        </div>
        

    </div> <!-- end continer -->

    <footer>
        <p>العنوان: صنعاء شارع التحرير خلف البنك المركزي</p>
        <p>الهاتف: </p>
    </footer>

</body>

</html>
